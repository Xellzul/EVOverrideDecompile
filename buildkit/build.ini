; EV Override build kit: where the tools and the game copies are, inside the image.
;
; The image build (Dockerfile) unpacks them from your folder of original downloads (input-files/README.md) into
; /opt/evo: toolchain/ and game/, laid out file for file as the repository's tools expect them (unpack/layout.tsv).
; Nothing of it is in the repository or ever written into it. A relative path is relative to the repository root.
; `python3 buildkit/build.py check` verifies every one of those files by size and SHA-256.

[paths]
; where the build goes (in evo/)
out = buildkit/out
; the image's toolchain/ and game/ trees, and the image build's note that it had every input (targets.txt lists evo)
toolchain = /opt/evo/toolchain
game = /opt/evo/game
targets = /opt/evo/targets.txt
; the build roots: a copy of the sources and the kit's tools with links to the two trees above (buildlib/work.py),
; on the container's own disk
work = /var/tmp/evo-kit

[tools]
; FlexLM's licence file for the Windows-hosted Metrowerks programs (MWLinkPPC.exe, MWCPPC.exe): the
; CW Pro 5 Windows CD's own, as its installer lays it beside the command-line tools
license = /opt/evo/toolchain/cwpro5-win/Tools/Command Line Tools/license.dat
